name: "Bug Fix"
description: "Streamlined workflow for bug fixes and hotfixes"

stages:
  - name: "investigation"
    description: "Investigate and document the bug"
    commit_policy: "engram_only"
    quality_gates:
      - command: "engram validate bug-documented"
        required: true
        
  - name: "reproduction"
    description: "Create tests that reproduce the bug"
    commit_policy: "tests_only"
    quality_gates:
      - command: "cargo test"
        required: true
        expected_result: "failure"
        failure_message: "Tests should fail to prove they reproduce the bug"
        
  - name: "fix"
    description: "Implement the bug fix"
    commit_policy: "code_with_tests"
    quality_gates:
      - command: "cargo test"
        required: true
        expected_result: "success"
      - command: "cargo clippy"
        required: true
        
  - name: "verification"
    description: "Verify fix and run full test suite"
    commit_policy: "full_validation"
    quality_gates:
      - command: "nix build"
        required: true
      - command: "cargo test --all-features"
        required: true

transitions:
  - from: "investigation"
    to: "reproduction"
    trigger: "manual"
    
  - from: "reproduction"
    to: "fix"
    trigger: "manual"
    
  - from: "fix"
    to: "verification"
    trigger: "auto"