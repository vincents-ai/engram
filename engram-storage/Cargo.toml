[package]
name = "engram-storage"
version = "0.6.3"
edition = "2021"
authors = ["Vincent Palmer <shift@someone.section.me>"]
description = "Storage implementations for the engram AI memory layer — git-refs, in-memory, relationship graph"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"

[dependencies]
engram-core = { path = "../engram-core", features = ["git"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
sha2 = "0.10"
tracing = "0.1"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
