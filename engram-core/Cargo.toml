[package]
name = "engram-core"
version = "0.6.3"
edition = "2021"
authors = ["Vincent Palmer <shift@someone.section.me>"]
description = "Core traits, types, and errors for the engram AI memory layer"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"

[dependencies]
# Minimal deps — traits, types, errors only
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
schemars = { version = "0.8", features = ["derive", "chrono"] }
serde_yaml = "0.9"

# Optional git dependencies for error conversions
gix = { version = "0.83", default-features = false, features = ["max-performance-safe", "sha1"], optional = true }

[features]
default = []
gix = ["dep:gix"]
